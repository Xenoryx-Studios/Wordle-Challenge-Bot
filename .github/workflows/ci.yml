name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install tools
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  build:
    name: Build & Push Docker Image to GHCR
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t wordle-bot:ci .

      # Only publish on pushes to main: PRs (including from forks) don't
      # get registry credentials, and shouldn't be able to publish images.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image tags
        if: github.event_name == 'push'
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          IMAGE_SHA=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wordle-bot:$SHA_TAG
          IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wordle-bot:latest
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Tag and push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag wordle-bot:ci "$IMAGE_SHA"
          docker tag wordle-bot:ci "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
