name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install tools
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  # Decides whether the image needs rebuilding. Denylist on purpose: any
  # change not listed here triggers a build, so forgetting to update the list
  # costs an extra build rather than a stale image. Keep it in sync with
  # .dockerignore (anything skipped here must not be copied into the image).
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes that affect the image
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (new branch, force-push to unknown commit): build.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md|docs/*|LICENSE|tests/*|pytest.ini|requirements-dev.txt|makefile|.github/dependabot.yml|.github/pull_request_template.md) ;;
              *) echo "Image affected by: $file"; image=true ;;
            esac
          done <<< "$(git diff --name-only "$BASE...$HEAD")"

          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Docker Image to GHCR
    needs: [lint, test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t wordle-bot:ci .

      # Only publish on pushes to main: PRs (including from forks) don't
      # get registry credentials, and shouldn't be able to publish images.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image tags
        if: github.event_name == 'push'
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          IMAGE_SHA=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wordle-bot:$SHA_TAG
          IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wordle-bot:latest
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Tag and push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag wordle-bot:ci "$IMAGE_SHA"
          docker tag wordle-bot:ci "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
